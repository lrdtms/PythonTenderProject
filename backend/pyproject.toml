[project]
name = "intel-tps-backend"
version = "0.1.0"
description = "IntelTPS backend: FastAPI modular monolith and background worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=25.1.0",
    "alembic>=1.20.0",
    "email-validator>=2.3.0",
    "pymupdf>=1.28.2",
    "pdfplumber>=0.11.10",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "import-linter>=2.0",
    "hypothesis>=6.170.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]
"migrations/env.py" = ["E402", "I001"]

# Architecture fitness function F2 (docs/architecture/architecture.md).
[tool.importlinter]
root_packages = ["app", "fastapi", "sqlalchemy"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: api/worker -> infrastructure -> modules -> db -> kernel"
type = "layers"
layers = [
    "app.api | app.worker",
    "app.infrastructure",
    "app.modules",
    "app.db",
    "app.kernel",
]
# config.py sits beside the layers and may be imported by anything.
exhaustive = false

[[tool.importlinter.contracts]]
name = "Kernel and extraction are pure (no web framework, no ORM)"
type = "forbidden"
source_modules = ["app.kernel", "app.modules.extraction"]
forbidden_modules = ["fastapi", "sqlalchemy"]
